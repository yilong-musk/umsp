[package]
name = "umsp"
version = "0.1.9"
edition = "2024"
rust-version = "1.85"
# Never published to crates.io: install via the release archive or `make install`.
publish = false
description = "UMSP — universal model service provider: one local binary, three protocols"
license = "MIT"
repository = "https://github.com/yilong-musk/umsp"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.8", features = ["derive"] }
clap_complete = "4.6.12"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = "0.4.3"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util", "sync"] }
toml = "1.2.1"
toml_edit = "0.25.19"
webpki-roots = "1.0.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
