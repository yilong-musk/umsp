name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and republish (vX.Y.Z)"
        required: true
        type: string

# One release build at a time. A second tag waits; it does not cancel a
# publish that is already uploading assets.
concurrency:
  group: umsp-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: verify release tag
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tag matches Cargo.toml and is on main
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ver="$(awk -F'"' '/^\[package\]/{p=1; next} p && /^version *=/{print $2; exit}' Cargo.toml)"
          [[ "$tag" == "v${ver}" ]]
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  ci:
    if: github.event_name == 'push'
    needs: [verify-tag]
    uses: ./.github/workflows/ci.yml

  publish:
    name: github release
    if: github.event_name == 'push'
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: umsp-x86_64-linux-musl
          path: dist
      - name: publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ls -l dist
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/*.sha256 \
              --target "${GITHUB_SHA}" \
              --title "$tag" \
              --notes "Static musl build of UMSP ${tag}."
          fi
          gh release view "$tag" --json tagName,assets \
            --jq '{tag: .tagName, assets: [.assets[].name]}'
