name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: deploy script
        run: bash scripts/deploy-host-test.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: language check
        run: cargo run --quiet --manifest-path tools/langcheck/Cargo.toml
      - name: cargo test
        run: cargo test --locked

  deny:
    name: cargo deny (licenses, bans, sources, advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build-musl:
    name: release (x86_64-unknown-linux-musl)
    runs-on: ubuntu-24.04
    needs: [test, deny]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: package
        run: |
          set -eu
          ./scripts/stage-release.sh target/x86_64-unknown-linux-musl/release/umsp
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: umsp-x86_64-linux-musl
          path: |
            dist/umsp-*.tar.gz
            dist/umsp-*.tar.gz.sha256
